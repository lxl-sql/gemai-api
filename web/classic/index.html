<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      lang="zh"
      content="统一的 AI 模型聚合与分发网关，支持将各类大语言模型跨格式转换为 OpenAI、Claude、Gemini 兼容接口，为个人与企业提供集中式模型管理与网关服务。"
    />
    <meta
      name="description"
      lang="en"
      content="A unified AI model hub for aggregation & distribution. It supports cross-converting various LLMs into OpenAI-compatible, Claude-compatible, or Gemini-compatible formats. A centralized gateway for personal and enterprise model management."
    />
    <meta name="generator" content="new-api" />
    <meta name="build-version" content="__BUILD_VERSION__" />
    <title>New API</title>
    <script>
    (function(){
      var R='_ar',V=document.querySelector('meta[name="build-version"]').content;
      function isAppResource(t){
        if(!t)return false;
        var tag=t.tagName;
        if(tag!=='SCRIPT'&&tag!=='LINK')return false;
        var raw=tag==='SCRIPT'?t.src:t.href;
        if(!raw)return false;
        try{
          var u=new URL(raw,location.href);
          if(u.origin!==location.origin)return false;
          return u.pathname.indexOf('/assets/')===0||u.pathname.indexOf('/src/')===0;
        }catch(e){return false}
      }
      function reloadWithCacheBust(){
        var c=+(sessionStorage.getItem(R)||0);
        if(c>=3)return;
        sessionStorage.setItem(R,c+1);
        var u=new URL(location.href);
        u.searchParams.set('_r',Date.now());
        location.replace(u.pathname+u.search+u.hash);
      }
      window.addEventListener('error',function(e){
        if(isAppResource(e.target))reloadWithCacheBust();
      },true);
      window.addEventListener('load',function(){
        sessionStorage.removeItem(R);
        if(location.search.indexOf('_r=')>-1){
          var u=new URL(location.href);
          u.searchParams.delete('_r');
          history.replaceState(null,'',u.pathname+u.search+u.hash);
        }
      });
      if(V&&V!=='__BUILD_'+'VERSION__'){
        try{fetch('/api/status').then(function(r){return r.json()}).then(function(d){
          if(d.data&&d.data.version&&d.data.version!==V){
            reloadWithCacheBust();
          }
        }).catch(function(){})}catch(e){}
      }
    })();
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
