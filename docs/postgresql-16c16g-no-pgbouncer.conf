# =========================================================
# PostgreSQL 配置 — 16 核 / 16GB 专用（不使用 PgBouncer）
# 适用版本：PostgreSQL 15
#
# 说明：
# - 这是应用直连 PostgreSQL 的保守生产配置。
# - 重点防护：长事务、锁等待、自动 DDL、连接过多、autovacuum 跟不上。
# - shared_buffers / max_connections / wal_level 等参数需要重启 PostgreSQL。
# - lock_timeout / statement_timeout / 日志 / autovacuum 多数参数 reload 即可生效。
# =========================================================

listen_addresses = '*'                  # 配合防火墙白名单使用，仅放行应用实例、从库和运维 IP

# ---------------------------------------------------------
# 连接
# ---------------------------------------------------------
# 不使用 PgBouncer 时，PostgreSQL 后端连接数不能太低。
# 如果应用配置是 8 实例 × SQL_MAX_OPEN_CONNS=40，理论峰值约 320。
# 这里给运维、迁移、只读任务留余量，但避免 1000 连接压垮 16GB 内存。
max_connections = 500
superuser_reserved_connections = 5

# 死连接快速回收。跨机断连后，避免僵尸连接长时间占用连接槽。
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ---------------------------------------------------------
# 内存（按 16GB 物理内存分配）
# ---------------------------------------------------------
shared_buffers = 4GB
effective_cache_size = 12GB

# work_mem 不是每连接固定占用，而是每个排序/哈希节点都可能使用。
# 直连 500 连接时不建议设置过大。
work_mem = 8MB

maintenance_work_mem = 1GB
autovacuum_work_mem = 256MB
wal_buffers = 16MB

# ---------------------------------------------------------
# 事务与锁保护
# ---------------------------------------------------------
# 财务/扣费/充值场景建议保持 on。off 可能在数据库崩溃时丢失尾部已返回成功的事务。
synchronous_commit = on

# 自动断开长时间开着事务不动的连接，避免 idle in transaction 持锁拖垮全站。
idle_in_transaction_session_timeout = '60s'

# 防止 DDL 或业务 SQL 长时间等锁。尤其可避免 ALTER TABLE users 这类 DDL 排队卡住全站。
lock_timeout = '5s'

# 防止异常 SQL 无限运行。报表/维护任务如确实需要更久，可在单独会话里 SET statement_timeout = 0。
statement_timeout = '120s'

deadlock_timeout = '1s'

# ---------------------------------------------------------
# WAL / Checkpoint
# ---------------------------------------------------------
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB

# ---------------------------------------------------------
# 并行查询（16 核）
# ---------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# ---------------------------------------------------------
# 磁盘（SSD 假设；机械盘请删除这两行用默认值）
# ---------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------
# Autovacuum
# ---------------------------------------------------------
# 全局兜底。users/channels/tokens/quota_data 等热点表建议另配表级参数。
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ---------------------------------------------------------
# 读写分离 / 复制
# ---------------------------------------------------------
# 如果没有逻辑复制，建议使用 replica，WAL 更少。
# 如果正在使用逻辑复制或订阅，保持 logical。
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 4096MB
hot_standby = on

# ---------------------------------------------------------
# 日志
# ---------------------------------------------------------
log_min_duration_statement = 1000
log_lock_waits = on
log_autovacuum_min_duration = 1000
log_checkpoints = on
log_line_prefix = '%m [%p] %u@%d '

# ---------------------------------------------------------
# 维护窗口建议
# ---------------------------------------------------------
# 执行手动 DDL / VACUUM / REINDEX 前，建议在当前会话临时关闭部分超时：
#
# SET lock_timeout = '30s';
# SET statement_timeout = 0;
#
# 不要在高峰期执行 ALTER TABLE users 这类可能拿强锁的 DDL。
