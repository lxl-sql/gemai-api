# =========================================================
# PostgreSQL 配置 — 16 核 / 16GB 专用（new-api 主库）
# 适用版本：PostgreSQL 15
# 修改 shared_buffers / max_connections / wal_level 等需重启数据库，
# 其余大部分参数 pg_ctl reload 或 SELECT pg_reload_conf() 即可生效。
# =========================================================

listen_addresses = '*'          # ⚠️ 配合防火墙白名单使用：仅放行应用实例与从库 IP

# ---------------------------------------------------------
# 连接
# ---------------------------------------------------------
max_connections = 1000              # 应用侧已限流（8 实例 × SQL_MAX_OPEN_CONNS=40 = 320），余量给从库/运维工具
superuser_reserved_connections = 5

# 死连接快速回收（默认 2 小时太久；跨机断连后残留的僵尸连接曾堆积占用槽位）
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ---------------------------------------------------------
# 内存（按 16GB 物理内存分配）
# ---------------------------------------------------------
shared_buffers = 4GB                # 25% 内存
effective_cache_size = 12GB         # 75% 内存，供查询规划器估算
work_mem = 16MB                     # 单次排序/哈希可用内存；并发高时勿盲目调大
maintenance_work_mem = 1GB          # 手动 VACUUM / CREATE INDEX 用
autovacuum_work_mem = 256MB         # autovacuum 每个 worker 单独占用，必须小于 maintenance_work_mem
wal_buffers = 16MB

# ---------------------------------------------------------
# 事务与锁 —— 本次并发故障的针对性修复，缺一不可
# ---------------------------------------------------------
synchronous_commit = off            # 高频小事务提交不等 WAL 落盘，扣费事务持锁时间大幅缩短；
                                    # 数据库崩溃最多丢失尾部数百毫秒已提交事务，数据不会损坏
idle_in_transaction_session_timeout = 60000   # 60s 自动断开"事务开着不动"的会话，
                                              # 清理断连遗留的持锁僵尸事务（unexpected EOF with open transaction）
deadlock_timeout = 1s

# ---------------------------------------------------------
# WAL / Checkpoint
# ---------------------------------------------------------
checkpoint_timeout = 15min          # 默认 5min 导致每 5 分钟集中刷 100~200MB 脏页
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB

# ---------------------------------------------------------
# 并行查询（16 核）
# ---------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# ---------------------------------------------------------
# 磁盘（SSD 假设；机械盘请删除这两行用默认值）
# ---------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------
# Autovacuum —— 高频更新热表（users/channels/tokens）膨胀的治本项。
# 表级参数（fillfactor=70、scale_factor=0.01）由应用启动时自动设置，
# 这里是全局兜底。
# ---------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s            # 巡逻间隔，默认 60s
autovacuum_vacuum_cost_limit = 2000 # 默认 200 清理太慢，追不上写入速度
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ---------------------------------------------------------
# 读写分离・主库流复制
# ---------------------------------------------------------
wal_level = logical                 # 逻辑复制模式。⚠️ 注意：逻辑复制不同步 DDL，
                                    # new-api 升级做表结构迁移后需手动同步从库表结构；
                                    # 若实际使用物理流复制，改回 replica 可减少 WAL 量
max_wal_senders = 10
max_replication_slots = 10          # 逻辑复制槽位，创建订阅的前提
wal_keep_size = 4096MB              # 保留足够 WAL，初始克隆大表期间不被覆盖
hot_standby = on                    # 从库侧参数，主库上无副作用

# ---------------------------------------------------------
# 日志 —— 保留故障排查能力
# ---------------------------------------------------------
log_min_duration_statement = 1000   # 记录执行超过 1s 的语句
log_lock_waits = on                 # 锁等待超过 deadlock_timeout 即记录（定位锁热点的关键）
log_autovacuum_min_duration = 1000  # 记录耗时超过 1s 的 autovacuum，验证清理是否正常运转
log_checkpoints = on
log_line_prefix = '%m [%p] %u@%d '
